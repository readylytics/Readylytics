syntax = "proto3";

package app.readylytics.health.data.preferences;

option java_package = "app.readylytics.health.data.preferences";
option java_multiple_files = true;
option java_outer_classname = "UserPreferencesProtoFile";

enum SyncPreferenceProto {
    SYNC_NEVER = 0;
    SYNC_ALWAYS = 1;
    SYNC_BY_TIME = 2;
}

enum AppThemeProto {
    THEME_SYSTEM = 0;
    THEME_LIGHT = 1;
    THEME_DARK = 2;
}

enum BackupScheduleProto {
    BACKUP_MANUAL = 0;
    BACKUP_DAILY = 1;
    BACKUP_WEEKLY = 2;
}

enum PhysiologyProfileProto {
    // PROFILE_GENERAL (the proto3 zero/default) and PROFILE_SHIFT_WORKER are removed product
    // profiles. The enumerators are kept reserved (never reused) so older payloads/backups still
    // deserialize; both map to ACTIVE at the domain read boundary (UserPreferences.toDomainProfile).
    PROFILE_GENERAL = 0;
    PROFILE_ATHLETE = 1;
    PROFILE_ACTIVE = 2;
    PROFILE_SEDENTARY = 3;
    PROFILE_SHIFT_WORKER = 4;
}

enum UnitSystemProto {
    UNIT_METRIC = 0;
    UNIT_IMPERIAL = 1;
}

enum FallbackThemeColorProto {
    FALLBACK_GREEN_PERFORMANCE = 0;
    FALLBACK_BLUE_TRUST = 1;
    FALLBACK_PURPLE_INSIGHT = 2;
    FALLBACK_ICON_SIGNATURE = 3;
    FALLBACK_ICON_ELEMENTS = 4;
}

enum LoadSourceModeProto {
    LOAD_SOURCE_UNSET = 0;
    LOAD_SOURCE_WORKOUT_ONLY = 1;
    LOAD_SOURCE_EVERYDAY_HEART_RATE = 2;
}

enum Vo2MaxSourceModeProto {
    VO2_MAX_SOURCE_UNSET = 0;
    VO2_MAX_SOURCE_AUTO = 1;
    VO2_MAX_SOURCE_WEARABLE_ONLY = 2;
    VO2_MAX_SOURCE_ESTIMATED_ONLY = 3;
}

enum Vo2MaxEstimationMethodProto {
    VO2_MAX_METHOD_UNSET = 0;
    VO2_MAX_METHOD_HR_RATIO = 1;
    VO2_MAX_METHOD_MATERKO_ADAPTED = 2;
}

enum DayOfWeekProto {
    DAY_OF_WEEK_UNSET = 0;
    DAY_OF_WEEK_MONDAY = 1;
    DAY_OF_WEEK_TUESDAY = 2;
    DAY_OF_WEEK_WEDNESDAY = 3;
    DAY_OF_WEEK_THURSDAY = 4;
    DAY_OF_WEEK_FRIDAY = 5;
    DAY_OF_WEEK_SATURDAY = 6;
    DAY_OF_WEEK_SUNDAY = 7;
}

enum DashboardCardDisplayModeProto {
    DASHBOARD_CARD_DISPLAY_MODE_UNSET = 0;
    DASHBOARD_CARD_DISPLAY_MODE_VALUE = 1;
    DASHBOARD_CARD_DISPLAY_MODE_GAUGE = 2;
    DASHBOARD_CARD_DISPLAY_MODE_BAR = 3;
}

enum SleepScoreWeightProfileProto {
    SLEEP_WEIGHT_PROFILE_UNSET = 0;
    SLEEP_WEIGHT_PROFILE_BALANCED = 1;
    reserved 2, 3;
    reserved "SLEEP_WEIGHT_PROFILE_LIGHT_SLEEPER", "SLEEP_WEIGHT_PROFILE_HOURS_FIRST";
    SLEEP_WEIGHT_PROFILE_DURATION_FOCUSED = 4;
    SLEEP_WEIGHT_PROFILE_RECOVERY_FOCUSED = 5;
    SLEEP_WEIGHT_PROFILE_ARCHITECTURE_FOCUSED = 6;
    SLEEP_WEIGHT_PROFILE_CONTINUITY_FOCUSED = 7;
}


message UserPreferencesProto {
    float goal_sleep_hours = 1;
    
    oneof hrv_baseline_override_oneof {
        float hrv_baseline_override = 2;
    }
    oneof rhr_baseline_override_oneof {
        float rhr_baseline_override = 3;
    }
    
    SyncPreferenceProto sync_preference = 4;
    
    int32 sync_interval_hours = 5;
    int64 last_sync_timestamp = 6;
    int32 max_heart_rate = 7;
    bool auto_calculate_max_hr = 8;
    bool manual_zone_editing = 9;
    
    float zone_1_min_percent = 10;
    float zone_1_max_percent = 11;
    float zone_2_max_percent = 12;
    float zone_3_max_percent = 13;
    float zone_4_max_percent = 14;
    
    int32 zone_1_min_bpm = 15;
    int32 zone_1_max_bpm = 16;
    int32 zone_2_max_bpm = 17;
    int32 zone_3_max_bpm = 18;
    int32 zone_4_max_bpm = 19;
    
    int32 age = 20;
    int32 birth_day = 21;
    int32 birth_month = 22;
    int32 birth_year = 23;
    
    oneof gender_oneof {
        string gender = 24;
    }

    oneof height_cm_oneof {
        float height_cm = 61;
    }

    float hrv_optimal_threshold = 25;
    float hrv_warning_threshold = 26;
    float rhr_optimal_threshold = 27;
    float rhr_warning_threshold = 28;
    
    int32 resting_hr_before_minutes = 29;
    int32 resting_hr_after_minutes = 30;
    int32 resting_hr_percentile = 60;

    AppThemeProto app_theme = 31;
    bool dynamic_color_enabled = 51;
    
    reserved 32, 42;
    reserved "drive_account_email", "collapse_cloud_data";
    
    BackupScheduleProto backup_schedule = 33;
    
    int64 last_backup_timestamp = 34;
    int32 consistency_threshold_minutes = 35;
    int32 consistency_evaluation_days = 36;
    int32 consistency_baseline_days = 37;
    
    float ras_scaling_factor = 38;
    int32 step_goal = 39;
    
    bool retention_days_enabled = 40;
    int32 retention_days = 41;
    
    reserved 43, 44, 45, 46;
    
    bool about_dismissed = 47;
    
    PhysiologyProfileProto physiology_profile = 48;
    
    int64 install_date = 49;
    
    oneof circadian_threshold_override_oneof {
        string circadian_threshold_override = 50;
    }

    TrimpMethodProto trimp_method = 52;
    float cheng_beta = 53;
    float itrimp_b = 54;
    float ras_calibration = 55;

    oneof primary_device_name_oneof {
        string primary_device_name = 56;
    }

    oneof backup_directory_uri_oneof {
        string backup_directory_uri = 57;
    }

    oneof backup_password_hash_oneof {
        string backup_password_hash = 58;
    }

    bool is_birthday_configured = 59;

    UnitSystemProto unit_system = 62;

    // Per–data-type source device selection. Key = HealthDataType.name,
    // value = device label (as produced by DeviceLabel). An absent key means
    // "All devices" (no source filtering) for that data type.
    map<string, string> device_by_data_type = 63;

    FallbackThemeColorProto fallback_theme_color = 64;
    bool background_sync_enabled = 65;
    int32 background_sync_interval_minutes = 66;
    bool is_custom_palette_enabled = 67;
    int64 custom_secondary_color = 68;
    int64 custom_tertiary_color = 69;
    int64 custom_primary_color = 70;

    // IANA timezone id used for all scoring day-boundary math. Stored so scores are
    // reproducible across devices for identical data + preferences. Empty = un-seeded
    // (falls back to the device zone until the seed migration / first run sets it).
    string scoring_zone_id = 71;

    // Permanent dismissal of the "press Apply to resync" info dialog shown
    // when the user changes a Data Sources device selection.
    bool device_change_notice_dismissed = 72;

    // Source of heart-rate data used for Strain Ratio (load score) computations.
    // LOAD_SOURCE_UNSET (proto3 zero value) = never explicitly set; resolves to
    // SettingsDefaults.STRAIN_LOAD_SOURCE_MODE at the domain read boundary.
    LoadSourceModeProto strain_load_source_mode = 73;

    // Source of heart-rate data used for RAS computations.
    // LOAD_SOURCE_UNSET (proto3 zero value) = never explicitly set; resolves to
    // SettingsDefaults.RAS_SOURCE_MODE at the domain read boundary.
    LoadSourceModeProto ras_source_mode = 74;

    // Maximum offset from each 1/2/3-minute HRR target used for nearest-sample matching.
    // Zero means unset and resolves to SettingsDefaults.HRR_TOLERANCE_SECONDS.
    int32 hrr_tolerance_seconds = 75;

    // Gap threshold for merging same-day sleep segments into one core block.
    optional int32 core_merge_gap_minutes = 76;

    // Minutes from midnight after which same-day sessions are treated as core sleep candidates.
    optional int32 supplemental_cutoff_minutes_of_day = 77;

    // Minimum segment duration counted toward daily sleep aggregation.
    optional int32 minimum_counted_sleep_segment_minutes = 78;

    // Required stage coverage for supplemental blocks to contribute architecture totals.
    optional int32 supplemental_architecture_coverage_percent = 79;

    // Whether the user has permanently dismissed the "this overrides your custom
    // card display settings" confirmation for the global dashboard display-mode setting.
    bool bulk_display_mode_notice_dismissed = 80;

    // The mode most recently applied (or reset) via the global dashboard display-mode
    // setting. DASHBOARD_CARD_DISPLAY_MODE_UNSET (proto3 zero value) = never applied;
    // resolves to null at the domain read boundary.
    DashboardCardDisplayModeProto last_global_display_mode = 81;

    // User-configurable "elevated" deviation threshold for the body temperature baseline
    // insight, in degrees Celsius. Not read by any scoring formula. Unset (proto3 zero value
    // via `optional` presence check) resolves to SettingsDefaults.BODY_TEMP_ELEVATED_THRESHOLD_CELSIUS.
    optional float body_temp_elevated_threshold_celsius = 82;

    // Emphasis applied to the sleep-score sub-scores.
    // SLEEP_WEIGHT_PROFILE_UNSET (proto3 zero value) resolves to SettingsDefaults.SLEEP_SCORE_WEIGHT_PROFILE.
    SleepScoreWeightProfileProto sleep_score_weight_profile = 83;

    // Percent of the sleep goal at which the oversleep penalty begins (100–125, 5% steps).
    // Zero means unset and resolves to SettingsDefaults.HYPERSOMNIA_ONSET_PERCENT.
    optional int32 hypersomnia_onset_percent = 84;

    // Version of the scoring formulas the stored scores were produced with.
    int32 scoring_version = 85;

    // Snapshot of the three sleep-scoring inputs at the last successful historical recompute
    // (folded in from the deleted SleepScoreRecalcBaselineStore). Absence = "never recalced",
    // which the Sleep Settings read boundary resolves to the factory defaults. `optional` so a
    // worker that recomputed nothing (no-op) does not suppress a genuinely pending recalculation.
    optional SleepScoreWeightProfileProto last_recalc_sleep_score_weight_profile = 86;
    optional float last_recalc_goal_sleep_hours = 87;
    optional int32 last_recalc_hypersomnia_onset_percent = 88;

    // Day the user's week starts on, for weekly training analytics ("this week"/"last week").
    // DAY_OF_WEEK_UNSET (proto3 zero value) = never explicitly set; resolves to
    // SettingsDefaults.WEEK_START_DAY at the domain read boundary.
    DayOfWeekProto week_start_day = 89;

    // One-time flag: Banister multiplier defaults have been migrated to 1.0.
    // Prevents re-running the migration on subsequent launches.
    bool trimp_normalization_migrated = 90;

    // Removed residual-fatigue toggle. Keep its number/name permanently unavailable so old
    // enabled=false values cannot gate the now always-on fatigue model.
    reserved 91;
    reserved "residual_fatigue_enabled";

    // Always-on Residual Fatigue model parameters.
    optional float residual_fatigue_half_life_hours = 92;
    optional float residual_fatigue_gain = 93;

    // Editable Training Readiness parameters plus the atomically applied recompute snapshot.
    optional float training_readiness_residual_fatigue_scale = 94;
    optional float training_readiness_load_balance_weight = 95;
    optional float last_applied_training_readiness_residual_fatigue_scale = 96;
    optional float last_applied_training_readiness_load_balance_weight = 97;

    // Source used to resolve DailySummary.vo2Max: wearable-measured vs. Uth resting-HR-ratio estimate.
    // VO2_MAX_SOURCE_UNSET (proto3 zero value) = never explicitly set; resolves to
    // Vo2MaxSourceMode.AUTO at the domain read boundary.
    Vo2MaxSourceModeProto vo2_max_source_mode = 98;

    // Which resting estimator computes DailySummary.vo2Max when the source resolves to an estimate.
    // VO2_MAX_METHOD_UNSET (proto3 zero value) = never explicitly set; resolves to
    // Vo2MaxEstimationMethod.HR_RATIO at the domain read boundary.
    Vo2MaxEstimationMethodProto vo2_max_estimation_method = 99;
}

enum TrimpMethodProto {
    TRIMP_BANISTER = 0;
    TRIMP_ITRIMP = 1;
    TRIMP_CHENG = 2;
}
