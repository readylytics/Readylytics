syntax = "proto3";

package app.readylytics.health.data.preferences;

option java_package = "app.readylytics.health.data.preferences";
option java_multiple_files = true;
option java_outer_classname = "WorkoutsLayoutConfigurationsProtoFile";

message WorkoutCardConfigurationProto {
    string card_id = 1;
    bool is_visible = 2;
    int32 position = 3;
    string requested_display_mode = 4;
}

message WorkoutChartConfigurationProto {
    string chart_id = 1;
    bool is_visible = 2;
    int32 position = 3;
}

message WorkoutHistoryConfigurationProto {
    string history_id = 1;
    bool is_visible = 2;
    int32 position = 3;
}

message WorkoutsLayoutConfigurationsProto {
    repeated WorkoutCardConfigurationProto workout_cards = 1;
    repeated WorkoutChartConfigurationProto workout_charts = 2;
    repeated WorkoutHistoryConfigurationProto workout_history = 3;
    int32 version = 4;
}
