name: CI

on:
  pull_request:
    branches:
      - main
      - "feature/**"
      - "claude/**"

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v3.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v3.5.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      # --- Verification Phase ---
      # By dropping continue-on-error and using !cancelled(), GitHub naturally tracks failures
      # but continues to execute the remaining steps.

      - name: Check formatting (ktlint)
        run: ./gradlew ktlintCheck

      - name: Static analysis (detekt)
        if: ${{ !cancelled() }}
        run: ./gradlew detekt

      - name: Run lint
        if: ${{ !cancelled() }}
        run: ./gradlew lint lintRelease

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest

      - name: Generate coverage report
        if: ${{ !cancelled() }}
        run: ./gradlew jacocoTestReport

      - name: Enforce coverage gates (aggregate + core:database repository floor)
        if: ${{ !cancelled() }}
        run: ./gradlew jacocoCoverageVerification :core:database:jacocoCoverageVerification

      # --- Artifact Upload Phase ---

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoTestReport/

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.xml
