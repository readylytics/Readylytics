name: CI

on:
  pull_request:
    branches:
      - main
      - "feature/**"
      - "claude/**"

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v3.0.0
        with:
          packages: "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v3.5.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      # --- Verification Phase ---
      # By dropping continue-on-error and using !cancelled(), GitHub naturally tracks failures
      # but continues to execute the remaining steps.

      - name: Check formatting (ktlint)
        run: ./gradlew ktlintCheck

      - name: Static analysis (detekt)
        if: ${{ !cancelled() }}
        run: ./gradlew detekt

      - name: Run lint
        if: ${{ !cancelled() }}
        run: ./gradlew lint lintRelease

      # Guards against the drift that left :database-benchmark uncompilable and its benchmarks
      # silently not running. `assembleDebug` does not build any module's androidTest sources, and
      # the two benchmark modules were not built by ANY CI step, so 35 compile errors accumulated
      # there unnoticed across several phases. Compiling the instrumentation sources on every PR is
      # cheap and would have caught all of them.
      # Bounded heap/worker count and a hard timeout: an unbounded cold multi-module androidTest
      # compile has previously OOM'd forked Kotlin/KSP workers on this shared 2-core runner
      # (see scripts/run-instrumented-tests.sh), which leaves the Gradle daemon waiting on a
      # dead worker forever with no further log output. Fail fast instead of hanging for hours.
      - name: Compile instrumented test sources (incl. benchmark modules)
        if: ${{ !cancelled() }}
        run: |
          timeout --signal=TERM --kill-after=30s 20m ./gradlew \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" \
            assembleDebugAndroidTest :benchmark:assembleBenchmarkBenchmark --max-workers=2 --stacktrace --console=plain

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest

      - name: Generate coverage report
        if: ${{ !cancelled() }}
        run: ./gradlew jacocoTestReport

      - name: Enforce coverage gates (aggregate + core:database repository floor)
        if: ${{ !cancelled() }}
        run: ./gradlew jacocoCoverageVerification :core:database:jacocoCoverageVerification

      # --- Artifact Upload Phase ---

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoTestReport/

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.xml
